<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <title>JAKIDZ — Learn in little leaps</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --ink: #17212b;
        --muted: #71808c;
        --paper: #fffdf8;
        --cream: #f5efe5;
        --coral: #ef6f61;
        --coral2: #f59a67;
        --teal: #167c80;
        --teal2: #58b8a9;
        --yellow: #f5c95b;
        --line: #e5ded2;
        --shadow: 0 18px 45px rgba(35, 48, 52, 0.09);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        min-height: 100%;
        background: var(--paper);
        color: var(--ink);
        font-family: "DM Sans", sans-serif;
      }
      button,
      input,
      select {
        font: inherit;
      }
      button {
        cursor: pointer;
        border: 0;
      }
      .app {
        min-height: 100dvh;
      }
      .hidden {
        display: none !important;
      }
      .screen {
        min-height: 100dvh;
      }
      .wrap {
        width: min(1120px, calc(100% - 40px));
        margin: auto;
      }
      .serif {
        font-family: Fraunces, serif;
      }
      .fade {
        animation: rise 0.55s cubic-bezier(0.2, 0.8, 0.2, 1) both;
      }
      @keyframes rise {
        from {
          opacity: 0;
          transform: translateY(16px);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }
      @keyframes float {
        50% {
          transform: translateY(-8px);
        }
      }
      @keyframes pop {
        50% {
          transform: scale(1.12);
        }
      }
      @keyframes confetti {
        to {
          transform: translateY(100vh) rotate(520deg);
          opacity: 0;
        }
      }
      .grain:after {
        content: "";
        position: fixed;
        inset: 0;
        pointer-events: none;
        opacity: 0.025;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 140 140' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
      }
      .top {
        height: 72px;
        border-bottom: 1px solid var(--line);
        display: flex;
        align-items: center;
        justify-content: space-between;
        background: rgba(255, 253, 248, 0.9);
        backdrop-filter: blur(12px);
        position: sticky;
        top: 0;
        z-index: 5;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 11px;
        font-weight: 700;
        letter-spacing: 0.02em;
      }
      .mark {
        width: 38px;
        height: 38px;
        border-radius: 13px;
        background: var(--coral);
        color: #fff;
        display: grid;
        place-items: center;
        font-family: Fraunces;
        font-size: 22px;
        box-shadow: 4px 5px 0 #d8524b;
      }
      .pill {
        border: 1px solid var(--line);
        background: var(--paper);
        border-radius: 99px;
        padding: 9px 14px;
        color: var(--muted);
        font-weight: 600;
      }
      .btn {
        border-radius: 14px;
        padding: 13px 18px;
        font-weight: 700;
        transition:
          0.2s transform,
          0.2s box-shadow,
          0.2s background;
      }
      .btn:hover {
        transform: translateY(-2px);
      }
      .primary {
        background: var(--coral);
        color: #fff;
        box-shadow: 0 7px 0 #d9564e;
      }
      .primary:hover {
        box-shadow: 0 9px 0 #d9564e;
      }
      .teal {
        background: var(--teal);
        color: #fff;
        box-shadow: 0 7px 0 #0b5e62;
      }
      .soft {
        background: #f4e9dc;
        color: var(--ink);
      }
      .ghost {
        background: transparent;
        color: var(--muted);
      }
      .card {
        background: #fff;
        border: 1px solid var(--line);
        border-radius: 24px;
        box-shadow: var(--shadow);
      }
      .eyebrow {
        font-size: 11px;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        font-weight: 700;
        color: var(--muted);
      }
      h1,
      h2,
      h3,
      p {
        margin-top: 0;
      }
      .auth {
        background: var(--cream);
        display: grid;
        place-items: center;
        padding: 30px;
        overflow: hidden;
        position: relative;
      }
      .auth:before,
      .auth:after {
        content: "";
        position: absolute;
        border-radius: 50%;
        filter: blur(2px);
      }
      .auth:before {
        width: 430px;
        height: 430px;
        background: #f7d98f;
        right: -150px;
        top: -150px;
      }
      .auth:after {
        width: 280px;
        height: 280px;
        background: #afd9c8;
        left: -100px;
        bottom: -100px;
      }
      .auth-grid {
        width: min(1050px, 100%);
        display: grid;
        grid-template-columns: 1fr 400px;
        gap: 90px;
        align-items: center;
        position: relative;
        z-index: 1;
      }
      .intro h1 {
        font-size: clamp(48px, 7vw, 84px);
        line-height: 0.96;
        margin: 18px 0;
        color: var(--ink);
      }
      .intro p {
        font-size: 19px;
        line-height: 1.55;
        color: #53656a;
        max-width: 480px;
      }
      .rays {
        color: var(--coral);
        font-size: 38px;
        display: block;
        animation: float 3s ease-in-out infinite;
      }
      .login {
        padding: 34px;
      }
      .login h2 {
        font-size: 28px;
        margin-bottom: 8px;
      }
      .sub {
        color: var(--muted);
        line-height: 1.5;
      }
      .field {
        margin: 18px 0;
      }
      .field label {
        display: block;
        font-size: 12px;
        font-weight: 700;
        color: var(--muted);
        margin-bottom: 7px;
        text-transform: uppercase;
        letter-spacing: 0.08em;
      }
      .input {
        width: 100%;
        padding: 14px;
        border: 1px solid var(--line);
        border-radius: 13px;
        background: #fffdf9;
        outline: 0;
      }
      .input:focus {
        border-color: var(--teal);
        box-shadow: 0 0 0 4px #d9efeb;
      }
      .dash {
        background: #f7f4ee;
      }
      .dash-main {
        padding: 36px 0 70px;
      }
      .dash-head {
        display: flex;
        justify-content: space-between;
        align-items: end;
        gap: 20px;
        margin-bottom: 30px;
      }
      .dash-head h1 {
        font-size: clamp(34px, 5vw, 55px);
        line-height: 1;
        margin: 8px 0;
      }
      .dash-grid {
        display: grid;
        grid-template-columns: 1.35fr 0.65fr;
        gap: 22px;
      }
      .hero {
        background: var(--teal);
        color: #fff;
        padding: 28px;
        position: relative;
        overflow: hidden;
      }
      .hero:after {
        content: "✦";
        position: absolute;
        font-size: 170px;
        right: 18px;
        bottom: -48px;
        color: rgba(255, 255, 255, 0.1);
        transform: rotate(15deg);
      }
      .hero h2 {
        font-size: 30px;
        max-width: 440px;
        margin-bottom: 9px;
      }
      .hero p {
        color: #c8e8df;
        max-width: 480px;
        line-height: 1.5;
      }
      .children {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 14px;
        margin-top: 14px;
      }
      .child {
        padding: 19px;
        position: relative;
        overflow: hidden;
        transition: 0.2s transform;
      }
      .child:hover {
        transform: translateY(-4px);
      }
      .avatar {
        width: 54px;
        height: 54px;
        display: grid;
        place-items: center;
        border-radius: 18px;
        background: #ffe1ad;
        font-size: 28px;
      }
      .child .name {
        font-size: 20px;
        font-weight: 700;
        margin: 12px 0 3px;
      }
      .mini {
        font-size: 13px;
        color: var(--muted);
      }
      .bar {
        height: 8px;
        background: #eee7dc;
        border-radius: 10px;
        overflow: hidden;
      }
      .bar i {
        height: 100%;
        display: block;
        border-radius: 10px;
        background: var(--coral);
      }
      .subject-row {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 13px 0;
        border-bottom: 1px solid var(--line);
      }
      .subject-row:last-child {
        border: 0;
      }
      .subject-dot {
        width: 36px;
        height: 36px;
        border-radius: 12px;
        display: grid;
        place-items: center;
        background: #fbe1d8;
        color: var(--coral);
        font-weight: 700;
      }
      .insight {
        padding: 24px;
      }
      .insight h3 {
        font-size: 20px;
        margin-bottom: 17px;
      }
      .spark {
        height: 60px;
        display: flex;
        align-items: end;
        gap: 5px;
        margin: 10px 0 20px;
      }
      .spark i {
        flex: 1;
        background: var(--teal2);
        border-radius: 6px 6px 2px 2px;
        min-height: 8px;
      }
      .note {
        background: #fff5dd;
        border-radius: 15px;
        padding: 14px;
        font-size: 14px;
        line-height: 1.45;
      }
      .selectbar {
        display: flex;
        gap: 10px;
        align-items: center;
      }
      .kid {
        background: #fbf5e9;
      }
      .kidtop {
        background: var(--teal);
        color: white;
        padding: 22px 0 85px;
      }
      .kidtop h1 {
        font-size: 38px;
        margin: 10px 0 4px;
      }
      .kidbody {
        margin-top: -58px;
        padding-bottom: 50px;
      }
      ..kidbody {
        margin-top: -58px;
      }
      .recommend {
        padding: 24px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 20px;
      }
      .recommend h2 {
        font-size: 26px;
        margin: 7px 0;
      }
      .recommend p {
        color: var(--muted);
        margin-bottom: 0;
      }
      .subjects {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 15px;
        margin-top: 16px;
      }
      .subject {
        padding: 23px;
        min-height: 165px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        transition: 0.2s;
      }
      .subject:hover {
        transform: translateY(-4px);
      }
      .subject.math {
        background: #fff0e6;
        border-color: #f7c7b0;
      }
      .subject.eng {
        background: #e5f4f0;
        border-color: #b9ddd5;
      }
      .subject h3 {
        font-size: 24px;
        margin: 0;
      }
      .subject .icon {
        font-size: 38px;
      }
      .level-wrap {
        padding: 34px 0;
        background: #fbf5e9;
        min-height: 100dvh;
      }
      .levels {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(145px, 1fr));
        gap: 13px;
      }
      .level {
        padding: 18px;
        min-height: 125px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        transition: 0.2s;
      }
      .level:hover {
        transform: translateY(-4px);
      }
      .level.locked {
        opacity: 0.45;
        filter: saturate(0.4);
      }
      .level b {
        font-size: 25px;
      }
      .stars {
        color: var(--yellow);
        letter-spacing: 2px;
      }
      .worksheet {
        background: #fbf5e9;
        min-height: 100dvh;
      }
      .ws-head {
        background: #fff;
        padding: 18px 0;
        border-bottom: 1px solid var(--line);
        position: sticky;
        top: 0;
        z-index: 4;
      }
      .ws-head-in {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 14px;
      }
      .progress {
        height: 10px;
        background: #eee6da;
        border-radius: 20px;
        margin-top: 15px;
        overflow: hidden;
      }
      .progress i {
        height: 100%;
        display: block;
        background: var(--coral);
        transition: width 0.4s;
      }
      .question-card {
        width: min(720px, 100%);
        margin: 38px auto;
        padding: 30px;
        text-align: center;
      }
      .question-card h2 {
        font-size: clamp(28px, 5vw, 46px);
        margin: 22px 0 28px;
        line-height: 1.15;
      }
      .options {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
      }
      .option {
        background: #fff;
        border: 2px solid var(--line);
        border-radius: 16px;
        padding: 16px;
        font-weight: 700;
        min-height: 56px;
      }
      .option:hover {
        border-color: var(--teal);
        background: #f1faf7;
      }
      .option.correct {
        border-color: #29a276;
        background: #e6f6ee;
        color: #147454;
      }
      .option.wrong {
        border-color: var(--coral);
        background: #fff0ed;
        color: #b54840;
      }
      .feedback {
        border-radius: 14px;
        padding: 13px;
        margin-top: 22px;
        text-align: left;
        line-height: 1.4;
      }
      .feedback.good {
        background: #e5f5ed;
        color: #167554;
      }
      .feedback.bad {
        background: #fff0ed;
        color: #b04a42;
      }
      .results {
        background: #fbf5e9;
        display: grid;
        place-items: center;
        padding: 26px;
      }
      .result-card {
        text-align: center;
        padding: 38px;
        width: min(530px, 100%);
      }
      .result-score {
        font-size: 70px;
        font-weight: 700;
        color: var(--teal);
        line-height: 1;
      }
      .celebrate {
        font-size: 70px;
        animation: pop 0.7s ease;
      }
      .recbox {
        text-align: left;
        background: #eef7f3;
        padding: 16px;
        border-radius: 16px;
        margin: 20px 0;
        line-height: 1.5;
      }
      .modal {
        position: fixed;
        inset: 0;
        background: rgba(25, 34, 35, 0.48);
        display: grid;
        place-items: center;
        padding: 20px;
        z-index: 20;
      }
      .modal .card {
        padding: 28px;
        width: min(460px, 100%);
      }
      .toast {
        position: fixed;
        left: 50%;
        bottom: 25px;
        transform: translateX(-50%);
        background: var(--ink);
        color: #fff;
        padding: 13px 18px;
        border-radius: 99px;
        z-index: 30;
        box-shadow: var(--shadow);
      }
      .conf {
        position: fixed;
        top: -15px;
        width: 9px;
        height: 16px;
        z-index: 25;
        animation: confetti 2.4s linear forwards;
      }
      .print-btn {
        background: transparent;
        color: var(--muted);
        font-size: 13px;
        font-weight: 700;
        padding: 4px 6px;
        border-radius: 8px;
        margin-top: 6px;
        text-align: left;
      }
      .print-btn:hover {
        color: var(--teal);
        background: #eef7f3;
      }
      #print-area {
        display: none;
      }
      @media print {
        body {
          background: #fff;
        }
        #app,
        #toast,
        .grain:after {
          display: none !important;
        }
        #print-area {
          display: block;
          font-family: "DM Sans", sans-serif;
          color: #111;
        }
        #print-area .pw-page {
          page-break-after: always;
          padding: 6mm 2mm;
        }
        #print-area .pw-page:last-child {
          page-break-after: auto;
        }
        #print-area .pw-head {
          display: flex;
          justify-content: space-between;
          align-items: baseline;
          border-bottom: 2px solid #111;
          padding-bottom: 8px;
          margin-bottom: 6px;
        }
        #print-area h1 {
          font-family: Fraunces, serif;
          font-size: 22px;
          margin: 0;
        }
        #print-area .pw-meta {
          font-size: 12px;
          color: #444;
        }
        #print-area .pw-fields {
          display: flex;
          gap: 28px;
          font-size: 13px;
          margin: 10px 0 14px;
        }
        #print-area .pw-q {
          border-bottom: 1px dashed #bbb;
          padding: 8px 0;
          break-inside: avoid;
        }
        #print-area .pw-q .qt {
          font-size: 14px;
          margin: 0 0 6px;
          line-height: 1.35;
        }
        #print-area .pw-opts {
          font-size: 13px;
          display: flex;
          flex-wrap: wrap;
          gap: 6px 22px;
          margin: 0 0 6px 18px;
        }
        #print-area .pw-space {
          height: 16mm;
        }
        #print-area .pw-space.small {
          height: 9mm;
        }
        #print-area .pw-line {
          border-bottom: 1px solid #999;
          height: 9mm;
          width: 70%;
          margin-left: 18px;
        }
        #print-area .pw-key li {
          font-size: 14px;
          margin: 6px 0;
        }
        #print-area .pw-note {
          font-size: 12px;
          color: #555;
          margin-top: 10px;
        }
      }
      @media (max-width: 760px) {
        .auth-grid,
        .dash-grid {
          grid-template-columns: 1fr;
          gap: 28px;
        }
        .intro {
          text-align: center;
        }
        .intro p {
          margin-left: auto;
          margin-right: auto;
        }
        .intro h1 {
          font-size: 55px;
        }
        .login {
          padding: 25px;
        }
        .dash-head {
          align-items: start;
          flex-direction: column;
        }
        .children {
          grid-template-columns: 1fr;
        }
        .recommend {
          align-items: start;
          flex-direction: column;
        }
        .subjects {
          grid-template-columns: 1fr;
        }
        .wrap {
          width: min(100% - 28px, 1120px);
        }
        .question-card {
          margin-top: 22px;
          padding: 22px;
        }
        .options {
          grid-template-columns: 1fr;
        }
        .top {
          padding: 0 14px;
        }
      }
    </style>
  </head>
  <body class="grain">
    <div id="app"></div>
    <div id="toast" class="toast hidden"></div>
      <div id="level-modal" class="modal hidden" onclick="if(event.target===this)closeLevelModal()"></div>
    <div id="print-area"></div>
    <script>
      const MATH = [
        "7A",
        "6A",
        "5A",
        "4A",
        "3A",
        "2A",
        "A",
        "B",
        "C",
        "D",
        "E",
        "F",
        "G",
        "H",
        "I",
        "J",
        "K",
        "L",
        "M",
        "N",
        "O",
      ];
      const ENG = [
        "7A",
        "6A",
        "5A",
        "4A",
        "3A",
        "2A",
        "A",
        "B",
        "C",
        "D",
        "E",
        "F",
        "G",
        "H",
        "I",
        "J",
        "K",
        "L",
      ];
      const names = ["Mina", "Alex", "Noah", "Zoe"],
        avatars = ["✦", "●", "▲", "◆"];
      const key = "jakidz-local-v3";
      // Always start at auth — state is loaded from Firestore after Google sign-in
      let state = {
        parent: "",
        email: "",
        children: [],
        active: null,
        view: "auth",
        subject: null,
        level: null,
        quiz: null,
        question: 0,
        answers: [],
        started: 0,
        updatedAt: 0,
      };

      /* ---------- Cloud sync (Firebase Auth + Firestore) ----------
   Uses Firebase Hosting's reserved /__/firebase/init.js for config, so it
   works automatically when deployed to Firebase Hosting. Anywhere else
   (local preview, cleared config) the app quietly stays in local mode. */
      const cloud = {
        ready: false,
        user: null,
        db: null,
        unsub: null,
        status: "local",
        pending: false,
        applying: false,
        wasAnonymous: true,
      };
      const defaultState = () => ({
        parent: "",
        email: "",
        children: [],
        active: null,
        view: "dash",
        subject: null,
        level: null,
        quiz: null,
        question: 0,
        answers: [],
        started: 0,
        updatedAt: 0,
      });
      const storageKey = () =>
        cloud.user ? `jakidz-cloud-${cloud.user.uid}` : key;
      function setSync(s) {
        cloud.status = s;
        let el = document.getElementById("syncpill");
        if (el) el.textContent = syncLabel();
      }
      function syncLabel() {
        return cloud.status === "synced"
          ? "☁ Synced"
          : cloud.status === "saving"
            ? "☁ Saving…"
            : cloud.status === "offline"
              ? "☁ Offline — saved locally"
              : "Local mode";
      }
      function loadScript(src) {
        return new Promise((res, rej) => {
          let s = document.createElement("script");
          s.src = src;
          s.onload = res;
          s.onerror = rej;
          document.head.appendChild(s);
        });
      }
      async function initCloud() {
        try {
          await loadScript(
            "https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js",
          );
          await loadScript(
            "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js",
          );
          await loadScript(

        return `<main class="screen worksheet">${header(`<button class="btn ghost" onclick="quit()">Quit</button>`)}<div class="ws-head"><div class="wrap ws-head-in"><div><div class="eyebrow" ${rev ? 'style="color:#a8842d"' : ""}>${rev ? "Quick check · " : ""}${state.subject === "math" ? "Mathematics" : "English & Reading"}</div><b>Level ${(state.subject === "math" ? MATH : ENG)[state.level]}</b></div><span class="pill">${state.question + 1} / ${total}</span></div><div class="wrap progress"><i style="width:${pct}%"></i></div></div><div class="wrap"><section class="card question-card fade"><div class="eyebrow">${q.topic}</div><h2 class="serif">${q.text}</h2>${q.options ? `<div class="options">${q.options.map((x) => `<button class="option" onclick="answer('${esc(x)}',this)">${esc(x)}</button>`).join("")}</div>` : `<input class="input" id="typed" inputmode="decimal" autofocus placeholder="Type your answer" onkeydown="if(event.key==='Enter')answer($('#typed').value,this)"><button class="btn primary" style="margin-top:14px;width:100%" onclick="answer($('#typed').value,$('#typed'))">Check answer</button>`}<div id="feedback"></div></section></div></main>`;
      }
      function normalize(x) {
        let v = String(x)
          .toLowerCase()
          .replace(/[−–—]/g, "-")
          .replace(/\s/g, "")
          .replace(/\.0+$/, "");
        if (v.includes("/") && !v.startsWith("/")) {
          let p = v.split("/");
          if (p.length === 2 && Number(p[1]))
            return String(Number(p[0]) / Number(p[1]));
        }
        let n = Number(v);
        return Number.isFinite(n) ? String(n) : v;
      }
      function answer(val, el) {
        if ($("#feedback").innerHTML) return;
        let q = state.quiz[state.question],
          ok = normalize(val) === normalize(q.answer);
        state.answers.push({ q, got: val, ok });
        document
          .querySelectorAll(".option")
          .forEach((b) => (b.disabled = true));
        if (el && el.classList) el.classList.add(ok ? "correct" : "wrong");
        $("#feedback").innerHTML =
          `<div class="feedback ${ok ? "good" : "bad"}"><b>${ok ? "That's it." : "Not this time — you're still learning."}</b> ${ok ? "Your thinking is on track." : "The answer is " + esc(q.answer) + "."}<br><span style="font-size:13px">${q.hint}</span><br><button class="btn ${ok ? "teal" : "soft"}" style="margin-top:12px;padding:10px 14px" onclick="nextQ()">${state.question === state.quiz.length - 1 ? "See my results" : "Next question"} →</button></div>`;
      }
      function nextQ() {
        state.question++;
        if (state.question >= state.quiz.length) finish();
        else render();
      }
      function printWorksheet(i) {
        let c = active(),
          s = state.subject,
          list = s === "math" ? MATH : ENG,
          qs = generate(s, i),
          subj = s === "math" ? "Mathematics" : "English & Reading",
          today = new Date().toLocaleDateString(undefined, {
            year: "numeric",
            month: "long",
            day: "numeric",
          });
        let qHtml = qs
          .map(
            (q, n) =>
              `<div class="pw-q"><p class="qt"><b>${n + 1}.</b> ${esc(q.text)}</p>${q.options ? `<div class="pw-opts">${q.options.map((o, j) => `<span>${"ABCD"[j]}) ${esc(o)}</span>`).join("")}</div><div class="pw-space small"></div>` : `<div class="pw-space"></div><div class="pw-line"></div>`}</div>`,
          )
          .join("");
        let keyHtml = qs
          .map(
            (q, n) =>
              `<li><b>${n + 1}.</b> ${esc(q.answer)}${q.options ? ` (${"ABCD"[q.options.indexOf(q.answer)]})` : ""} <span style="color:#666;font-size:12px">— ${esc(q.hint)}</span></li>`,
          )
          .join("");
        $("#print-area").innerHTML =
          `<div class="pw-page"><div class="pw-head"><h1>JAKIDZ Worksheet</h1><span class="pw-meta">${subj} · Level ${list[i]} · ${esc(topic(s, i))}</span></div><div class="pw-fields"><span>Name: ${esc(c.name)}</span><span>Date: ${today}</span><span>Score: ____ / 10</span></div>${qHtml}<p class="pw-note">Show your working in the space under each question. Take your time — small steps count.</p></div><div class="pw-page"><div class="pw-head"><h1>Answer Key — for parents</h1><span class="pw-meta">${subj} · Level ${list[i]}</span></div><ol class="pw-key">${keyHtml}</ol><p class="pw-note">Mark together. 9 or 10 correct means your child is ready to try the next level.</p></div>`;
        window.print();
      }
      function finish() {
        let c = active(),
          score = state.answers.filter((a) => a.ok).length,
          total = state.quiz.length,
          pct = Math.round((score / total) * 100),
          o = c[state.subject];
        if (!state.reviewing) {
          o.history.push(pct);
          o.history = o.history.slice(-8);
          if (pct >= 90) o.stars = Math.min(5, o.stars + 1);
          if (
            pct >= 90 &&
            o.level < (state.subject === "math" ? MATH : ENG).length - 1 &&
            o.level <= state.level
          )
            o.level = Math.max(o.level, state.level + 1);
        }
        if (state.reviewing) {
          let r = state.reviewing,
            k = r.subject + ":" + r.level,
            prev = c.reviews && c.reviews[k] ? c.reviews[k].stage : 0;
          if (pct >= 80) {
            if (prev >= REVIEW_INTERVALS.length - 1) {
              delete c.reviews[k];
            } else {
              scheduleReview(c, r.subject, r.level, prev + 1);
            }
          } else {
            scheduleReview(c, r.subject, r.level, 0);
          }
          state.wasReview = true;
          state.reviewing = null;
        } else {
          state.wasReview = false;
          scheduleReview(c, state.subject, state.level, 0);
        }
        c.sessions++;
        c.streak++;
        state.result = { score, pct, total };
        save();
        nav("results");
      }
      function results() {
        let c = active(),
          r = state.result,
          score = r.score,
          total = r.total || 10,
          rev = state.wasReview,
          ready = rev ? r.pct >= 80 : r.pct >= 90;
        return `<main class="screen results"><section class="card result-card fade"><div class="celebrate">${ready ? "✦" : "•"}</div><div class="eyebrow">${rev ? (ready ? "Quick check complete" : "Quick check done") : ready ? "Gold star session" : "Practice complete"}</div><h1 class="serif" style="font-size:42px;margin:10px 0">${rev ? (ready ? "Still strong — nice remembering!" : "Good effort, " + esc(c.name) + " — it's coming back.") : ready ? "You're ready for the next rung!" : "Brave work, " + esc(c.name) + "."}</h1><div class="result-score">${score}<span style="font-size:28px;color:var(--muted)"> / ${total}</span></div><p class="sub">${r.pct}% accuracy · ${state.quiz[0].topic} ${rev ? "quick check" : "focus"}</p><div class="stars" style="font-size:28px;margin:18px">${rev ? (ready ? "★ ★ ★" : "★ ★ ☆") : "★".repeat(r.pct >= 90 ? 3 : r.pct >= 70 ? 2 : 1) + "☆".repeat(r.pct >= 90 ? 0 : r.pct >= 70 ? 1 : 2)}</div><div class="recbox"><b>Next best step</b><br>${state.wasReview ? (r.pct >= 80 ? "Review complete — this topic will come back a little later to keep it strong." : "We'll revisit this topic again tomorrow for one more calm pass.") : r.pct >= 90 ? "Try the next level while this idea is fresh." : "Repeat this level tomorrow; one more calm pass will help it stick."}</div><button class="btn primary" style="width:100%" onclick="start(state.subject)">Practice again</button><button class="btn ghost" style="width:100%;margin-top:8px" onclick="nav('kid')">Back to my garden</button></section></main>`;
      }
      function quit() {
        if (
          confirm(
            "Leave this worksheet? Your current answers will not be saved.",
          )
        )
          nav("kid");
      }
      function addChild() {
        let name = prompt("Child's name");
        if (!name) return;
        let id = "c" + Date.now();
        state.children.push({
          id,
          name: name.trim(),
          age: 8,
          avatar: avatars[state.children.length % avatars.length],
          math: { level: 0, stars: 0, history: [0] },
          english: { level: 0, stars: 0, history: [0] },
          streak: 0,
          sessions: 0,
        });
        save();
        render();
        toast("A new learning garden is ready.");
      }
      function placement() {
        let c = active(),
          math = Math.min(
            MATH.length - 1,
            Math.max(0, c.math.level + (c.math.history.at(-1) >= 85 ? 1 : 0)),
          ),
          eng = Math.min(
            ENG.length - 1,
            Math.max(
              0,
              c.english.level + (c.english.history.at(-1) >= 85 ? 1 : 0),
            ),
          );
        c.math.level = math;
        c.english.level = eng;
        save();
        toast(
          `${c.name} is placed at Math ${MATH[math]} and English ${ENG[eng]}`,
        );
      }
            function editLevels(id) {
        let c = state.children.find((ch) => ch.id === id);
        if (!c) return;
        let modal = document.getElementById("level-modal");
        modal.innerHTML = `<div class="card" style="padding:28px;width:min(460px,100%)"><div class="eyebrow">Level settings</div><h2 class="serif" style="margin:6px 0 22px">Set levels for ${esc(c.name)}</h2><label style="display:block;margin-bottom:6px;font-weight:600;font-size:14px">Mathematics</label><select id="lm-sel" style="width:100%;padding:11px 13px;border:1.5px solid var(--line);border-radius:10px;background:var(--paper);font-size:15px;margin-bottom:18px">${MATH.map((l, i) => `<option value="${i}"${i === c.math.level ? " selected" : ""}>Level ${l}${i === c.math.level ? " (current)" : ""}</option>`).join("")}</select><label style="display:block;margin-bottom:6px;font-weight:600;font-size:14px">English and Reading</label><select id="le-sel" style="width:100%;padding:11px 13px;border:1.5px solid var(--line);border-radius:10px;background:var(--paper);font-size:15px;margin-bottom:24px">${ENG.map((l, i) => `<option value="${i}"${i === c.english.level ? " selected" : ""}>Level ${l}${i === c.english.level ? " (current)" : ""}</option>`).join("")}</select><div style="display:flex;gap:10px"><button class="btn soft" style="flex:1" onclick="closeLevelModal()">Cancel</button><button class="btn primary" style="flex:2" onclick="saveLevels('${id}')">Save levels</button></div></div>`;
        modal.classList.remove("hidden");
      }
      function closeLevelModal() {
        document.getElementById("level-modal").classList.add("hidden");
      }
      function saveLevels(id) {
        let c = state.children.find((ch) => ch.id === id);
        if (!c) return;
        let ml = parseInt(document.getElementById("lm-sel").value, 10);
        let el = parseInt(document.getElementById("le-sel").value, 10);
        c.math.level = ml;
        c.english.level = el;
        closeLevelModal();
        save();
        render();
        toast(esc(c.name) + " level updated");
      }
render();
      initCloud();
    </script>
  </body>
</html>
